<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mimicro OS Setup</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #08111f;
      --card: rgba(10, 18, 33, 0.94);
      --text: #f4f7fb;
      --muted: #a8b6d0;
      --primary: #4cc9f0;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg), #0f1b31);
    }

    .card {
      width: min(100%, 420px);
      padding: 28px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid rgba(125, 170, 255, 0.18);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
    }

    p {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 8px;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 0 6px rgba(76, 201, 240, 0.14);
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1><span class="dot"></span>Rebooting...</h1>
    <p>The new network settings were saved successfully. The device will restart now.</p>
  </main>
</body>
</html>
