; MimicroOS base firmware — one environment per supported ESP32 board.
; `pio run` builds every environment in parallel (no manual one-by-one).
; Artifacts land in .pio/build/<env>/mimios-base-<chip>.bin (see tools/post_build.py).

[platformio]
default_envs = esp32, esp32-s3, esp32-c3, esp32-s2

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.filesystem = littlefs
extra_scripts = pre:tools/post_build.py

lib_deps =
    bblanchon/ArduinoJson@^7
    links2004/WebSockets @ ^2.6

; --- ESP32 (classic) ---
[env:esp32]
board = esp32dev
custom_chip = esp32
build_flags =
    -DLED_PIN=2
    -DCONFIG_BUTTON_PIN=0
    -DFIRMWARE_VERSION=\"$ENV{FIRMWARE_VERSION}\"

; --- ESP32-S3 ---
[env:esp32-s3]
board = esp32-s3-devkitc-1
custom_chip = esp32s3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_PIN=2
    -DCONFIG_BUTTON_PIN=0
    -DFIRMWARE_VERSION=\"$ENV{FIRMWARE_VERSION}\"

; --- ESP32-C3 ---
[env:esp32-c3]
board = esp32-c3-devkitm-1
custom_chip = esp32c3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_PIN=8
    -DCONFIG_BUTTON_PIN=9


[env:esp32-s2]
board = esp32-s2-saola-1
custom_chip = esp32s2
build_flags =
    -DFIRMWARE_VERSION=\"$ENV{FIRMWARE_VERSION}\"
    -DLED_PIN=15
    -DCONFIG_BUTTON_PIN=0
